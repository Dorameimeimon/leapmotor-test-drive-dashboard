    font-size: 22px;

    color: #1a1a2e;

  }
  .time-row {
    width: 1080px;
    margin: 0 auto 8px auto;
    font-size: 13px;
    color: #555;
  }
  .header h1 .dash-date {
    font-size: 16px;
    font-weight: 600;

  }
  .time-label { font-weight: 600; color: #333; }
  .time-value { color: #2c7a3a; font-weight: 600; }

  /* ===== 表格通用（无边框、斑马纹，参考CFT样式）===== */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: transparent;
    font-size: 13px;
  }
  th, td {
    border: none;
    padding: 10px 8px;
    text-align: center;
    white-space: nowrap;
    vertical-align: middle;
  }
  th {
    background: #1b4332;
    color: #fff;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 10px 6px;
    font-size: 13px;
  }
  th.col-manager { min-width: 90px; }
  th.col-pct { min-width: 80px; }
  th.col-score { min-width: 70px; }
  th.col-rank { min-width: 60px; }

  #mainTable thead th.th-schedule,
  #storeTable thead th.th-schedule {
    background: #c8e6c9;
    color: #1b1b1b;
    font-weight: 600;
  }

  #mainTable {
    table-layout: fixed;
    width: 1520px;
    margin: 0 auto;
  }
  #mainTable th, #mainTable td {
    width: auto;
    overflow: visible;
    text-overflow: initial;
  }

  /* ===== 数据行：无框线 + 斑马纹 ===== */
  tbody tr:nth-child(even) { background: #f7f8fa; }
  tbody tr:nth-child(odd) { background: #fff; }
  tbody tr:hover { background: #f0f4f0; }
  tbody tr.summary-row {
    background: #e8f5e9 !important;
    font-weight: 700;
  }
  tbody tr.summary-row:hover { background: #c8e6c9 !important; }
  tbody tr.note-row td {
    background: #fff;
    color: #888;
    font-size: 12px;
    text-align: left;
    padding: 4px 8px;
    border-top: 1px solid #eee;
  }

  /* ===== 热力图标色：12小区以华南为界，连续渐变（每人一色）=====
     高于华南：绿系，数值越大越深绿（最大最深 → 最接近华南最浅）
     低于华南：红系，数值越小越深红（最小最深 → 最接近华南最浅）*/
  td.num-cell.heat-cell {
    text-align: center !important;
    vertical-align: middle;
  }
  td.num-cell.heat-cell > span {
    display:inline-block; min-width:64px; padding:2px 10px; border-radius:12px; line-height:1.6; font-weight:700;
  }
  /* 华南汇总行：中性底色（基准分界线）*/
  td.num-cell.heat-neutral > span {
    display:inline-block; min-width:64px; padding:2px 10px; border-radius:12px; line-height:1.6; font-weight:700;
    background:#eeeeee; color:#555; border:1px dashed #b0b0b0;
  }

  /* 数字等宽字体 */
  td.num-cell { font-variant-numeric: tabular-nums; }

  /* ===== 试驾目标完成率 / 综合排名（分档色块：越大越绿、越小越红）===== */
  td.num-cell.bg-green-deep, td.num-cell.bg-green-med, td.num-cell.bg-green-light,
  td.num-cell.bg-neutral, td.num-cell.bg-red-light, td.num-cell.bg-red-med, td.num-cell.bg-red-deep {
    text-align: center !important;
    vertical-align: middle;
  }
  td.num-cell.bg-green-deep > span { background-color:#2e7d32; color:#fff; font-weight:700; }
  td.num-cell.bg-green-med  > span { background-color:#66bb6a; color:#1b5e20; font-weight:600; }
  td.num-cell.bg-green-light> span { background-color:#a5d6a7; color:#1b5e20; font-weight:600; }
  td.num-cell.bg-neutral   > span { background-color:#c8e6c9; color:#333; }
  td.num-cell.bg-red-light > span { background-color:#ffccbc; color:#bf360c; }
  td.num-cell.bg-red-med   > span { background-color:#ff8a65; color:#fff; font-weight:700; }
  td.num-cell.bg-red-deep  > span { background-color:#e64a19; color:#fff; font-weight:700; }
  td.num-cell.bg-green-deep > span, td.num-cell.bg-green-med > span, td.num-cell.bg-green-light > span,
  td.num-cell.bg-neutral > span, td.num-cell.bg-red-light > span, td.num-cell.bg-red-med > span, td.num-cell.bg-red-deep > span {
    display:inline-block; min-width:56px; padding:2px 10px; border-radius:12px; line-height:1.6;
  }

/** 综合排名连续渐变着色：1-6名绿系（1名最深→6名最浅），7-12名红系（7名最浅→12名最深），每人一色 */
function buildRankColorMap() {
  const map = {};
  const green = [1,2,3,4,5,6];
  const red   = [7,8,9,10,11,12];
  green.forEach((r, i) => {           // 1名=最深绿，6名=最浅绿
    const t = green.length > 1 ? i / (green.length - 1) : 0;
    const bg = lerpColor(CG_DEEP, CG_LIGHT, t);
    map[r] = { bg, txt: textOn(bg) };
  });
  red.forEach((r, i) => {             // 7名=最浅红，12名=最深红
    const t = red.length > 1 ? (red.length - 1 - i) / (red.length - 1) : 0;
    const bg = lerpColor(CR_DEEP, CR_LIGHT, t);
    map[r] = { bg, txt: textOn(bg) };
  });
  return map;
}

/** 连续渐变着色：12小区以华南为界，每人一色
 *  高于华南：绿系，数值最大→最深绿，最接近华南（最小高于值）→最浅绿
 *  低于华南：红系，数值最小→最深红，最接近华南（最大低于值）→最浅红
 *  返回 { key: { bg, txt } }，key 为经理名
 */
const CG_DEEP = [27, 94, 32];     // 深林绿 #1b5e20（最大值最深）
const CG_LIGHT = [165, 214, 167]; // 浅林绿 #a5d6a7（最接近华南最浅）
const CR_DEEP = [255, 125, 75];    // 珊瑚橙 #ff7d4b（最小值最深）
const CR_LIGHT = [255, 222, 208];  // 浅蜜桃 #ffded0（最接近华南最浅）

function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
function lerpColor(c1, c2, t) {
  return `rgb(${lerp(c1[0], c2[0], t)}, ${lerp(c1[1], c2[1], t)}, ${lerp(c1[2], c2[2], t)})`;
}
function textOn(bg) {
  const m = bg.match(/\d+/g);
  if (!m) return "#fff";
  const [r, g, b] = m.map(Number);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return lum > 150 ? "#173d17" : "#ffffff";
}

function buildContinuousMap(arr, south) {
  const map = {};
  const above = arr.filter(o => o.v > south).sort((a, b) => b.v - a.v); // 降序：最大在前
  const below = arr.filter(o => o.v < south).sort((a, b) => a.v - b.v); // 升序：最小在前
  above.forEach((o, i) => {
    const t = above.length > 1 ? i / (above.length - 1) : 0;
    const bg = lerpColor(CG_DEEP, CG_LIGHT, t);
    map[o.k] = { bg, txt: textOn(bg) };
  });
  below.forEach((o, i) => {
    const t = below.length > 1 ? i / (below.length - 1) : 0;
    const bg = lerpColor(CR_DEEP, CR_LIGHT, t);
    map[o.k] = { bg, txt: textOn(bg) };
  });
  return map;
}

function fmt(n, decimals = 1) {
  if (n === null || n === undefined) return "-";

function fmtInt(n) {

  return Number(n).toLocaleString("zh-CN");
}

  const targetRateOf = d => d.testDrive / (d.staffReq * PERIOD_DAYS) * 100;
  MANAGER_DATA.forEach(d => { d.targetRate = +targetRateOf(d).toFixed(2); });
  SUMMARY_ROW.targetRate = +targetRateOf(SUMMARY_ROW).toFixed(2);
  const targetRates = MANAGER_DATA.map(d => d.targetRate);

  // 试驾目标完成率得分 = 自身试驾目标完成率 ÷ 12小区最大试驾目标完成率 × 100（0-100分制）
  // 若12小区最大完成率 >100%，则分母取 100 封顶；结果保留两位小数
  // 得分用未舍入原始率计算（与潜客试驾率得分口径一致），避免中间四舍五入导致偏差（如华南 82.74→82.75）
  const maxRawTargetRate = Math.max(...MANAGER_DATA.map(d => targetRateOf(d)));
  const targetDenom = maxRawTargetRate > 100 ? 100 : maxRawTargetRate;
  MANAGER_DATA.forEach(d => { d.targetScore = +((targetRateOf(d) / targetDenom) * 100).toFixed(2); });
  SUMMARY_ROW.targetScore = +((targetRateOf(SUMMARY_ROW) / targetDenom) * 100).toFixed(2);

  const trialRates = MANAGER_DATA.map(d => d.trialRate);

  // 潜客试驾率得分 = 自身潜客试驾率 ÷ 12个小区最大潜客试驾率 ×100（保留2位小数）
  // 注意：必须用「未四舍五入的原始率」计算，避免中间舍入误差（华南 11.9486÷15.9847×100=74.75，而非 11.95÷15.98×100=74.78）
  const rawRateOf = d => d.testDrive / d.potential * 100;
  MANAGER_DATA.forEach(d => { d.trialRate = +rawRateOf(d).toFixed(2); });
  SUMMARY_ROW.trialRate = +rawRateOf(SUMMARY_ROW).toFixed(2);
  const maxRawRate = Math.max(...MANAGER_DATA.map(rawRateOf));
  MANAGER_DATA.forEach(d => {
    d.trialScore = +((rawRateOf(d) / maxRawRate) * 100).toFixed(2);
  });
  SUMMARY_ROW.trialScore = +((rawRateOf(SUMMARY_ROW) / maxRawRate) * 100).toFixed(2);

  // 综合得分 = 潜客试驾率得分 × 50% + 试驾目标完成率得分 × 50%
  MANAGER_DATA.forEach(d => { d.totalScore = +(d.trialScore * 0.5 + d.targetScore * 0.5).toFixed(2); });
  SUMMARY_ROW.totalScore = +(SUMMARY_ROW.trialScore * 0.5 + SUMMARY_ROW.targetScore * 0.5).toFixed(2);

  // 综合排名 = 按综合得分降序排，第1名分数最高，依次到第12名
  const sortedMgrs = [...MANAGER_DATA].sort((a, b) => b.totalScore - a.totalScore);
  sortedMgrs.forEach((d, i) => { d.rank = i + 1; });

  const schedCountOf = {};
  STORE_DATA.forEach(s => { schedCountOf[s.manager] = (schedCountOf[s.manager] || 0) + (s.schedule || 0); });
  MANAGER_DATA.forEach(d => {
    d.schedTarget = d.staffReq * SCHEDULE_DAYS;
    d.schedCount  = schedCountOf[d.manager] || 0;
    d.schedRate   = +(d.schedCount / d.schedTarget * 100).toFixed(2);
  });
  SUMMARY_ROW.schedTarget = SUMMARY_ROW.staffReq * SCHEDULE_DAYS;
  SUMMARY_ROW.schedCount  = Object.values(schedCountOf).reduce((a, b) => a + b, 0);
  SUMMARY_ROW.schedRate   = +(SUMMARY_ROW.schedCount / SUMMARY_ROW.schedTarget * 100).toFixed(2);

  // 月累锁单完成率 = 净增锁单 ÷ 净增锁单目标 × 100%，保留1位小数
  MANAGER_DATA.forEach(d => {
    const lo = LOCK_ORDER_DATA[d.manager];
    d.lockRate = lo ? +(lo.actual / lo.target * 100).toFixed(1) : null;
  });
  SUMMARY_ROW.lockRate = +(LOCK_ORDER_SOUTH.actual / LOCK_ORDER_SOUTH.target * 100).toFixed(1);
  // 找出完成率最低的3人（用于浅红热力图标记）
  const bottom3 = [...MANAGER_DATA]
    .filter(d => d.lockRate !== null)
    .sort((a, b) => a.lockRate - b.lockRate)
    .slice(0, 3)
    .map(d => d.manager);
  const lockBottom3Set = new Set(bottom3);

  let html = "";

  // 经理行（按综合得分降序：第1名→第12名）
  const southTrialRate = rawRateOf(SUMMARY_ROW);       // 华南原始潜客试驾率
  const southTargetRate = targetRateOf(SUMMARY_ROW);   // 华南原始试驾目标完成率

  // 连续渐变底色：12小区以华南为界，高于华南绿系（越大越深绿）、低于华南红系（越小越深红），每人一色
  const trialColorMap = buildContinuousMap(MANAGER_DATA.map(d => ({ k: d.manager, v: rawRateOf(d) })), southTrialRate);
  const targetColorMap = buildContinuousMap(MANAGER_DATA.map(d => ({ k: d.manager, v: targetRateOf(d) })), southTargetRate);
  const rankColorMap = buildRankColorMap();

  sortedMgrs.forEach(d => {
    const tc = trialColorMap[d.manager] || { bg: "#eeeeee", txt: "#333" };
    const gc = targetColorMap[d.manager] || { bg: "#eeeeee", txt: "#333" };
    html += `<tr>
      <td>${d.manager}</td>
      <td class="num-cell">${fmtInt(d.staffReq)}</td>
      <td class="num-cell">${fmtInt(d.potential)}</td>
      <td class="num-cell">${fmtInt(d.testDrive)}</td>
      <td class="num-cell heat-cell"><span style="background:${tc.bg};color:${tc.txt}">${d.trialRate.toFixed(2)}%</span></td>
      <td class="num-cell">${fmt(d.trialScore, 2)}</td>
      <td class="num-cell heat-cell"><span style="background:${gc.bg};color:${gc.txt}">${d.targetRate.toFixed(2)}%</span></td>
      <td class="num-cell">${fmt(d.targetScore, 2)}</td>
      <td class="num-cell">${fmt(d.totalScore, 2)}</td>
      <td class="num-cell heat-cell"><span style="background:${rankColorMap[d.rank].bg};color:${rankColorMap[d.rank].txt}">${d.rank}</span></td>
      <td class="num-cell">${lockBottom3Set.has(d.manager) ? '<span style="background:#ef9a9a;color:#fff;font-weight:700;display:inline-block;min-width:56px;padding:2px 10px;border-radius:12px;line-height:1.6">'+d.lockRate.toFixed(1)+'%</span>' : (d.lockRate !== null ? d.lockRate.toFixed(1) + '%' : '-')}</td>
      <td class="num-cell">${fmtInt(d.schedTarget)}</td>
      <td class="num-cell">${fmtInt(d.schedCount)}</td>
      <td class="num-cell">${fmt(d.schedRate, 2)}%</td>
    </tr>`;
  });

  // 华南汇总行
  html += `<tr class="summary-row">
    <td>${SUMMARY_ROW.manager}</td>
    <td class="num-cell">${fmtInt(SUMMARY_ROW.staffReq)}</td>
    <td class="num-cell">${fmtInt(SUMMARY_ROW.potential)}</td>
    <td class="num-cell">${fmtInt(SUMMARY_ROW.testDrive)}</td>
    <td class="num-cell"><span>${SUMMARY_ROW.trialRate.toFixed(2)}%</span></td>
    <td class="num-cell">${fmt(SUMMARY_ROW.trialScore, 2)}</td>
    <td class="num-cell"><span>${SUMMARY_ROW.targetRate.toFixed(2)}%</span></td>
    <td class="num-cell">${fmt(SUMMARY_ROW.targetScore, 2)}</td>
      <td class="num-cell">${fmt(SUMMARY_ROW.totalScore, 2)}</td>
      <td class="num-cell">-</td>
      <td class="num-cell">${SUMMARY_ROW.lockRate.toFixed(1)}%</td>
      <td class="num-cell">${fmtInt(SUMMARY_ROW.schedTarget)}</td>
      <td class="num-cell">${fmtInt(SUMMARY_ROW.schedCount)}</td>
      <td class="num-cell">${fmt(SUMMARY_ROW.schedRate, 2)}%</td>
    </tr>`;

  // 华南下方的说明文字
  html += `<tr class="note-row"><td colspan="14">1、各店人数要求为7月版本，本期试驾目标为9批/人</td></tr>`;
  html += `<tr class="note-row"><td colspan="14">2、门店取数范围为零跑中心+城市展厅，不含卫星店/社区店</td></tr>`;

  tbody.innerHTML = html;
}

// ============================================================
// 渲染子片区门店明细（单表连续 + 经理下拉筛选）
// ============================================================
function renderStoreGroups() {
  // 填充下拉选项（按主表经理顺序 + 其余经理）
  const sel = document.getElementById("managerFilter");
  const managerOrder = [...MANAGER_DATA.map(d => d.manager)];
  [...new Set(STORE_DATA.map(s => s.manager))].forEach(m => {
    if (!managerOrder.includes(m)) managerOrder.push(m);
  });
  managerOrder.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  });

  filterStores(); // 初始渲染全部
}

// 根据下拉选项筛选门店
function filterStores() {
  const sel = document.getElementById("managerFilter");
  const selected = sel.value;
  const tbody = document.getElementById("storeBody");

  const rows = selected
    ? STORE_DATA.filter(s => s.manager === selected)
    : STORE_DATA;

  let html = "";
  const targetDenom = MAX_TARGET_RATE > 100 ? 100 : MAX_TARGET_RATE;
  rows.forEach(s => {
    const storeTrialRateRaw = s.potential && s.drive != null ? (s.drive / s.potential * 100) : null;
    const storeTrialRate = storeTrialRateRaw != null ? +storeTrialRateRaw.toFixed(2) : null;
    const trialScore = storeTrialRateRaw != null ? +((storeTrialRateRaw / MAX_TRIAL_RATE) * 100).toFixed(2) : null;
    const storeTargetRateRaw = s.staffReq ? (s.drive / (s.staffReq * PERIOD_DAYS) * 100) : null;
    const storeTargetRate = storeTargetRateRaw != null ? +storeTargetRateRaw.toFixed(2) : null;
    const targetScore = storeTargetRateRaw != null ? +((storeTargetRateRaw / targetDenom) * 100).toFixed(2) : null;
    const storeTotalScore = (trialScore != null && targetScore != null) ? +(trialScore * 0.5 + targetScore * 0.5).toFixed(2) : null;
    html += `<tr>
      <td style="text-align:center;padding-left:8px;white-space:nowrap;">${s.store}</td>
      <td>${s.manager}</td>
      <td>${s.group}</td>
      <td>${s.type}</td>
      <td class="num-cell">${s.staffReq}</td>
      <td class="num-cell">${s.potential == null ? "-" : s.potential.toLocaleString("zh-CN")}</td>
      <td class="num-cell">${s.drive == null ? "-" : s.drive.toLocaleString("zh-CN")}</td>
      <td class="num-cell">${storeTrialRate != null ? storeTrialRate.toFixed(2) + "%" : "-"}</td>
      <td class="num-cell">${trialScore == null ? "-" : trialScore.toFixed(2)}</td>
      <td class="num-cell">${storeTargetRate == null ? "-" : storeTargetRate.toFixed(2) + "%"}</td>
      <td class="num-cell">${targetScore == null ? "-" : targetScore.toFixed(2)}</td>
      <td class="num-cell">${storeTotalScore == null ? "-" : storeTotalScore.toFixed(2)}</td>
      <td class="num-cell">${s.staffReq * SCHEDULE_DAYS}</td>
      <td class="num-cell">${s.schedule == null ? "-" : s.schedule}</td>
      <td class="num-cell">${s.staffReq ? (s.schedule / (s.staffReq * SCHEDULE_DAYS) * 100).toFixed(2) + "%" : "-"}</td>
    </tr>`;
  });

  tbody.innerHTML = html;
  document.getElementById("storeCount").textContent =
    `共 ${rows.length} 家门店${selected ? "（" + selected + "）" : ""}`;
}

// ============================================================
// 展开/收起子片区
// ============================================================
let subExpanded = true;
function toggleSub() {
  subExpanded = !subExpanded;
  const header = document.querySelector(".sub-header");
  const content = document.getElementById("subContent");
  if (subExpanded) {
    header.classList.remove("collapsed");
    header.querySelector(".arrow").textContent = "▼ 收起";
    content.classList.remove("collapsed");
  } else {
    header.classList.add("collapsed");
    header.querySelector(".arrow").textContent = "▶ 展开";
    content.classList.add("collapsed");
  }
}

// ============================================================
// 初始化
// ============================================================
// 动态日期：显示昨天的日期（格式 M/D）
(function() {
  var d = new Date();
  d.setDate(d.getDate() - 1);
  document.getElementById("dashDate").textContent = (d.getMonth() + 1) + "/" + d.getDate();
})();

renderMainTable();
renderStoreGroups();
</script>
